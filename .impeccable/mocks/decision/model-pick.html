<!doctype html>
<html><head><meta charset="utf-8"><title>The Idea Book</title>
<style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#2e2a26;font-family:"Helvetica Neue",Arial,sans-serif;color:#e9e4dc}
.sky{position:absolute;inset:0 0 55% 0;background:#8b9a86}
.lawn{position:absolute;left:0;right:0;top:45%;bottom:0;background:#5d6b45}
.patio{position:absolute;left:520px;right:-40px;top:470px;height:420px;background:#9a9186;transform:skewX(-18deg)}
.wall{position:absolute;left:640px;top:430px;width:520px;height:60px;background:#6e665d;transform:skewX(-18deg)}
.fire{position:absolute;left:900px;top:600px;width:120px;height:70px;border-radius:50%;background:#3a332d}
.house{position:absolute;right:0;top:120px;width:520px;height:360px;background:#cfc6b8}
.inset{position:absolute;left:72px;bottom:72px;width:300px;height:200px;background:#7d8a62;border:8px solid #e9e4dc}
.nav{position:absolute;left:72px;right:72px;top:32px;display:flex;justify-content:space-between;font-size:20px;font-weight:700}
h1{position:absolute;left:72px;top:150px;margin:0;font-size:104px;line-height:.92;letter-spacing:-.035em;font-weight:800;max-width:760px}
.swatch{position:absolute;right:72px;bottom:72px;display:flex;gap:10px;align-items:center}
.swatch i{display:block;width:64px;height:64px}
.btn{background:#b7542c;color:#fff;font-weight:800;font-size:26px;padding:20px 30px;margin-left:24px}
</style></head>
<body>
<div class="sky"></div><div class="lawn"></div><div class="house"></div><div class="patio"></div><div class="wall"></div><div class="fire"></div>
<div class="nav"><span>Stringline</span><span>Concepts · Pricing · Join</span></div>
<h1>Their yard. Your patio. Booked.</h1>
<div class="inset"></div>
<div class="swatch"><i style="background:#4b4d4f"></i><i style="background:#9a9186"></i><i style="background:#cdb894"></i><div class="btn">Join the pilot list</div></div>
</body></html>
